<div class="parent">

    <div class="child" *ngFor="let product of allprettys">
          <img src="{{product.image}}" alt="">
         <h2>{{product.category}}</h2>
          <h6>{{product.title}}</h6>
          <p>Rs.{{product.price}}</p>
          <h4>{{product.rating.rate}}⭐</h4>
        
         
        
        

    </div>



</div>
