<div class="parent">
    <div class="top">
        <input type="text" placeholder="text to search"[(ngModel)]="term" (keyup)="getStudentsWithQueryParams()">

        <label for="" style="position: relative; right:70px;">sortBY:</label>

        <!-- <input type="text" > -->
        <select name="" id="" class="v" [(ngModel)]="column">
            <option value=""></option>
            <option value="name">name</option>
            <option value="dob">D.O.B</option>
            <option value="city">City</option>
            <option value="phone">Phone</option>
            <option value="email">Email</option>

        </select>


        <label for="" style="position: relative;right:50px;" >Order:</label>
        <!-- <input type="text" class="order"> -->
        <select name="" id="" class="a" [(ngModel)]="order">
            <option value="asc">asc</option>
            <option value="desc">desc</option>

        </select>

        <button (click)="sort(column,order)" class="so">Sort</button>

        <label for="" style="position: relative;left:30px;">Number of items:</label>
        <!-- <input type="text"  class="of"> -->
        <select name="" id="" class="l"[(ngModel)]="page">
            <option value=""></option>
            <option value="">5</option>
            <option value="">10</option>
            <option value="">15</option>
            <option value="">20</option>
            <option value="">25</option>
            <option value="">30</option>
        </select>

        <label for="" style="position: relative;left:40px;">page:</label>
        <!-- <input type="text" class="pages"> -->
        <select name="" id="" class="u"[(ngModel)]=page>
            <option value=""></option>
            <option value="">1</option>
            <option value="">2</option>
            <option value="">3</option>
            <option value="">4</option>
            <option value="">5</option>
        

        </select>

        <button (click)="pagestudent(page)"class="pagen">Pagenate</button>
        <button class="Add">Add Id-Card</button>
       
    </div>
    <div class="boxes">
